version: '3.8'

services:
  sequential-thinking:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-sequential-thinking
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist database between container restarts
      - sequences-data:/app/data
    environment:
      # MCP Configuration
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_ENABLE_CORS=true
      - MCP_ALLOWED_ORIGINS=*

      # Database Configuration
      - DATABASE_PATH=/app/data/sequences.db

      # Memory Management
      - MAX_THOUGHT_HISTORY=2000
      - MAX_BRANCHES=50
      - MAX_THOUGHTS_PER_BRANCH=100

      # Logging
      - DISABLE_THOUGHT_LOGGING=false
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mcp-network

  # Optional: Nginx reverse proxy for production deployments
  # nginx:
  #   image: nginx:alpine
  #   container_name: mcp-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - sequential-thinking
  #   networks:
  #     - mcp-network

volumes:
  sequences-data:
    driver: local

networks:
  mcp-network:
    driver: bridge
